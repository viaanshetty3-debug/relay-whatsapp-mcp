name: Release

# Publishes to npm and the MCP Registry when a version tag (for example v1.3.0) is pushed.
# No tokens are stored: npm and the registry trust this workflow through GitHub's OIDC login
# ("trusted publishing"), which is set up once on npmjs.com.

on:
  push:
    tags: ['v*']
  # Manual run: publishes only to the MCP Registry (for when npm was published but the registry step failed).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5 or newer (npm 12 prints `npm pack --json` differently and breaks one test).
      - run: npm install -g npm@11

      - name: Tag must match package.json and server.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ]; then
            echo "Tag $tag, package.json $pkg, server.json $srv must all match."; exit 1
          fi

      - run: npm ci
        if: github.event_name == 'push'
      - run: npm run lint
        if: github.event_name == 'push'
      - run: npm test
        if: github.event_name == 'push'

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --provenance --access public

      - name: Publish to the MCP Registry
        run: |
          version="$(node -p "require('./server.json').version")"
          for i in $(seq 1 30); do
            npm view "relay-whatsapp-mcp@$version" version >/dev/null 2>&1 && break
            echo "Waiting for npm to show $version ($i)..."; sleep 10
          done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
