name: Bug report
description: Something doesn't work (setup, bridge, relay, doorway, auto-start…)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste keys, `.env` contents, phone numbers, or real messages.**
        Security problems: please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run doctor`
      description: It never prints secrets, but please double-check before pasting.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Android (Termux), Other]
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: OS version and Node version
      placeholder: e.g. Ubuntu 24.04, Node 22.14.0
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      multiple: true
      options: [npm run setup, Bridge / dashboard, WhatsApp pairing, Relay worker, Claude doorway, Failover (primary/standby), Auto-start, A specific tool, Docs]
  - type: dropdown
    id: client
    attributes:
      label: AI client
      multiple: true
      options: [Claude Desktop, Claude Code, claude.ai, ChatGPT, Other MCP client, Not relevant]
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      description: "`data/service.log`, `journalctl --user -u whatsapp-relay`, or terminal output. Remove anything personal."
      render: text
