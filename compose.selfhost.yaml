name: relay-selfhost
services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      PUBLIC_URL: https://${RELAY_DOMAIN:?Set a public domain first}
      BRIDGE_TOKEN: ${RELAY_OWNER_TOKEN:?Generate the private owner token first}
      AUTO_CONNECT: "true"
    volumes:
      - whatsapp_data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 60s
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set a public domain first}
      RELAY_ACME_EMAIL: ${RELAY_ACME_EMAIL:?Set a certificate contact email first}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - https_certificates:/data
      - https_config:/config
    depends_on:
      bridge:
        condition: service_healthy
volumes:
  whatsapp_data:
  https_certificates:
  https_config:
