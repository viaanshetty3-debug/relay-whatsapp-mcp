GOOGLE_CLIENT_ID = "369558608563-1k8rrrp2mngb4eqgvp08dbrajbkm1k0o.apps.googleusercontent.com"
# MICROSOFT_CLIENT_ID = "..."
GITHUB_CLIENT_ID = "Ov23liBHCVu0DwQN3ILV"
# FACEBOOK_CLIENT_ID = "..."
# Secrets (npx wrangler secret put NAME): SENDER_EMAIL (the Gmail that sends codes), ACCOUNTS_SIGNING_KEY, STATE_KEY,
# GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET, GITHUB_CLIENT_SECRET, FACEBOOK_CLIENT_SECRET
