name = "relay-accounts"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_names = false

[[durable_objects.bindings]]
name = "STORE"
class_name = "AccountsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountsStore"]

[vars]
DAILY_EMAIL_LIMIT = "450"
