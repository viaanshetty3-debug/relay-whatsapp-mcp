# Relay AI: free docs Q&A page on Cloudflare Workers AI (see README.md in this folder).
# Deploy: npx wrangler deploy   (needs a Cloudflare account; Workers Free plan is enough)
name = "relay-docs-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

# Rate-limit counters (SQLite-backed Durable Objects work on the Workers Free plan).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[vars]
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
DOCS_BASE = "https://raw.githubusercontent.com/viaanshetty3-debug/relay-whatsapp-mcp/main/"
# Workers AI Free includes 10,000 neurons/day per account. One answer here costs roughly
# 300 neurons (about 8k tokens of docs + the answer), so ~30 answers/day fit.
HOURLY_LIMIT_PER_IP = "30"
DAILY_LIMIT_PER_IP = "10"
DAILY_LIMIT_TOTAL = "30"
