# Relay Help: troubleshooting guide + free "Ask Relay AI" sidebar on Cloudflare Workers AI (see README.md in this folder).
# Deploy: npx wrangler deploy   (needs a Cloudflare account; Workers Free plan is enough)
name = "relay-docs-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# The browser script is serialized from functions in src/page.js; keep the bundle free of __name() helpers.
keep_names = false

[ai]
binding = "AI"

# Rate-limit counters (SQLite-backed Durable Objects work on the Workers Free plan).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[vars]
MODEL = "@cf/google/gemma-4-26b-a4b-it"
DOCS_BASE = "https://raw.githubusercontent.com/viaanshetty3-debug/relay-whatsapp-mcp/main/"
# Workers AI Free includes 10,000 neurons/day per account; one answer here costs about
# 90-100 neurons (measured), so roughly 100 AI answers/day. After that, and for a network
# over its hourly limit, the chat answers from a docs search instead (no limit).
HOURLY_LIMIT_PER_IP = "30"
# Optional, used first: Google Gemini Flash-Lite. Set the key as a secret (never in this file):
#   npx wrangler secret put GEMINI_API_KEY
# The cheapest current Flash-Lite model is picked automatically; set GEMINI_MODEL to override.
# Optional, used after Gemini: Claude. Set the key as a secret:
#   npx wrangler secret put ANTHROPIC_API_KEY
# Defaults to claude-opus-5-5 at low effort; set CLAUDE_MODEL (e.g. claude-haiku-5-5) or CLAUDE_EFFORT to override.
